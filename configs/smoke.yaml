# CPU integration configuration; not a robot benchmark.
model:
  backend: tiny
  image_size: 32
  latent_channels: 6
  spatial_stride: 4
  text_dim: 32
  text_length: 16
  width: 64
  layers: 2
  heads: 4
  horizon: 16
  action_dim: 2
  views: 1
  targets: [flow, action]
data:
  raw: data/toy/raw
  prepared: data/toy/prepared
  provider: oracle
  grid_size: 8
  stride: 16
train:
  device: cpu
  precision: fp32
  output: runs/toy_midtrain
  steps: 100
  batch_size: 4
  save_every: 50
  validate_every: 25
eval:
  backend: toy
  embodiment: toy_point
  camera_names: [front]
  horizon: 96
  sampler: euler
  execute_steps: 16
  output: runs/toy_eval
